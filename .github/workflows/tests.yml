name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # microxcaling takes its version from git tags (hatch-vcs), which
        # setuptools-scm can't read from the submodule checkout in CI.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "1.1.0"
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e external/microxcaling --no-deps

      # Only this project's tests; microxcaling's need its CUDA extension.
      - name: Run tests
        run: pytest tests/ -v
